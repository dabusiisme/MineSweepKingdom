<!doctype html>
<html><head><meta charset="utf-8"></head><body><pre id="out">PENDING</pre>
<script>
// ===== 与 assets/scripts/ui/TextureFactory.ts 完全一致的绘制逻辑 =====
function roundRect(g,x,y,w,h,r){const rad=Math.max(0,Math.min(r,w/2,h/2));
g.beginPath();g.moveTo(x+rad,y);g.lineTo(x+w-rad,y);g.arcTo(x+w,y,x+w,y+rad,rad);
g.lineTo(x+w,y+h-rad);g.arcTo(x+w,y+h,x+w-rad,y+h,rad);g.lineTo(x+rad,y+h);
g.arcTo(x,y+h,x,y+h-rad,rad);g.lineTo(x,y+rad);g.arcTo(x,y,x+rad,y,rad);g.closePath();}
function bevel(g,w,h,r,topLeft,bottomRight,inset){const i=inset;const rad=Math.max(1,r-i);
g.lineWidth=Math.max(1.5,Math.min(Math.min(w,h)*0.06,6));g.lineJoin="round";
g.beginPath();g.moveTo(w-rad-i,i);g.lineTo(i+rad,i);g.arcTo(i,i,i,i+rad,rad);g.lineTo(i,h-rad-i);
g.strokeStyle=topLeft;g.stroke();
g.beginPath();g.moveTo(i,h-rad-i);g.arcTo(i,h-i,i+rad,h-i,rad);g.lineTo(w-rad-i,h-i);
g.arcTo(w-i,h-i,w-i,h-rad-i,rad);g.lineTo(w-i,i+rad);g.strokeStyle=bottomRight;g.stroke();}
function mk(w,h){const c=document.createElement("canvas");c.width=Math.max(1,Math.round(w));
c.height=Math.max(1,Math.round(h));return {c,g:c.getContext("2d")};}

function cellCanvas(size,skin){const s=Math.max(8,Math.round(size));const {c,g}=mk(s,s);
const grd=g.createLinearGradient(0,0,0,s);
if(skin==="raised"){grd.addColorStop(0,"#ffffff");grd.addColorStop(0.5,"#eef3fa");grd.addColorStop(1,"#c9d5e4");}
else{grd.addColorStop(0,"#bcc7d6");grd.addColorStop(0.6,"#c8d3e1");grd.addColorStop(1,"#d6dfea");}
g.fillStyle=grd;g.fillRect(0,0,s,s);
const r=Math.max(2,Math.min(s*0.09,6));const b=Math.max(1,s*0.03);
if(skin==="raised"){bevel(g,s,s,r,"rgba(255,255,255,0.98)","rgba(108,124,150,0.55)",b);}
else{bevel(g,s,s,r,"rgba(96,112,138,0.55)","rgba(255,255,255,0.95)",b);
g.save();g.beginPath();g.rect(0,0,s,s);g.clip();
const sh=g.createLinearGradient(0,0,0,s*0.55);sh.addColorStop(0,"rgba(66,80,104,0.42)");sh.addColorStop(1,"rgba(84,99,124,0)");
g.fillStyle=sh;g.fillRect(0,0,s,s*0.55);g.restore();}
return c;}

function iconCanvas(kind,size){const s=Math.max(8,Math.round(size));const {c,g}=mk(s,s);g.lineCap="round";
if(kind==="star"){const cx=s/2,cy=s*0.52,outer=s*0.46,inner=outer*0.44;
g.save();g.shadowColor="rgba(206,148,18,0.55)";g.shadowBlur=s*0.12;g.beginPath();
for(let i=0;i<10;i++){const a=-Math.PI/2+(Math.PI/5)*i;const rr=i%2===0?outer:inner;
const x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;if(i===0)g.moveTo(x,y);else g.lineTo(x,y);}
g.closePath();const sg=g.createLinearGradient(0,cy-outer,0,cy+outer);
sg.addColorStop(0,"#ffe89a");sg.addColorStop(0.5,"#ffc93c");sg.addColorStop(1,"#e39b16");
g.fillStyle=sg;g.fill();g.restore();g.lineWidth=Math.max(1,s*0.035);g.strokeStyle="rgba(176,118,10,0.75)";g.stroke();}
else if(kind==="flag"){const x=s*0.3;g.strokeStyle="#6b7280";g.lineWidth=Math.max(1.5,s*0.075);
g.beginPath();g.moveTo(x,s*0.12);g.lineTo(x,s*0.82);g.stroke();
g.beginPath();g.moveTo(x-s*0.2,s*0.84);g.lineTo(x+s*0.22,s*0.84);g.stroke();
const fg=g.createLinearGradient(x,s*0.12,s*0.9,s*0.42);fg.addColorStop(0,"#ff8a8a");fg.addColorStop(1,"#e33b3b");
g.beginPath();g.moveTo(x+s*0.03,s*0.14);g.lineTo(s*0.9,s*0.3);g.lineTo(x+s*0.03,s*0.47);g.closePath();
g.fillStyle=fg;g.fill();}
else{const cx=s/2,cy=s/2,rad=s*0.28;g.strokeStyle="#4a5262";g.lineWidth=Math.max(1.5,s*0.08);
for(let i=0;i<8;i++){const a=(Math.PI/4)*i;g.beginPath();
g.moveTo(cx+Math.cos(a)*rad*0.85,cy+Math.sin(a)*rad*0.85);
g.lineTo(cx+Math.cos(a)*rad*1.55,cy+Math.sin(a)*rad*1.55);g.stroke();}
const mg=g.createRadialGradient(cx-rad*0.35,cy-rad*0.4,rad*0.1,cx,cy,rad*1.15);
mg.addColorStop(0,"#8892a6");mg.addColorStop(0.45,"#4d5666");mg.addColorStop(1,"#232a36");
g.beginPath();g.arc(cx,cy,rad,0,Math.PI*2);g.fillStyle=mg;g.fill();
g.beginPath();g.arc(cx-rad*0.32,cy-rad*0.34,rad*0.24,0,Math.PI*2);g.fillStyle="rgba(255,255,255,0.75)";g.fill();}
return c;}

function backgroundCanvas(W,H){const {c,g}=mk(W,H);
const grd=g.createLinearGradient(0,0,0,H);grd.addColorStop(0,"#eef5fd");grd.addColorStop(0.45,"#e2edfa");grd.addColorStop(1,"#d3e2f4");
g.fillStyle=grd;g.fillRect(0,0,W,H);
const glow=g.createRadialGradient(W*0.5,-H*0.12,10,W*0.5,-H*0.12,H*0.72);
glow.addColorStop(0,"rgba(255,255,255,0.85)");glow.addColorStop(1,"rgba(255,255,255,0)");
g.fillStyle=glow;g.fillRect(0,0,W,H);return c;}

function barCanvas(W,H){const {c,g}=mk(W,H);
roundRect(g,1,1,W-2,H-2,14);g.fillStyle="#f7fafd";g.fill();
g.lineWidth=1.5;g.strokeStyle="rgba(186,202,220,0.95)";g.stroke();return c;}

function panelCanvas(W,H){const {c,g}=mk(W,H);const r=26,b=2;
g.save();g.shadowColor="rgba(58,72,98,0.4)";g.shadowBlur=18;g.shadowOffsetY=8;
const grd=g.createLinearGradient(0,b,0,H-b);grd.addColorStop(0,"#fffdf9");grd.addColorStop(0.6,"#fdf8ef");grd.addColorStop(1,"#f0e9dc");
roundRect(g,b,b,W-b*2,H-b*2,r);g.fillStyle=grd;g.fill();g.restore();
bevel(g,W,H,r,"rgba(255,255,255,1)","rgba(150,136,110,0.45)",b+1);return c;}

function buttonCanvas(W,H,tone){const {c,g}=mk(W,H);const r=Math.min(H/2,16),b=1.5;
const palettes={neutral:["#ffffff","#eaf1fa","#c6d4e6"],primary:["#c3ebd7","#93dab9","#62bd93"],disabled:["#e9edf3","#e2e7ee","#d3d9e2"]};
const pal=palettes[tone];
g.save();g.shadowColor="rgba(72,92,124,0.3)";g.shadowBlur=8;g.shadowOffsetY=3;
const grd=g.createLinearGradient(0,b,0,H-b);grd.addColorStop(0,pal[0]);grd.addColorStop(0.55,pal[1]);grd.addColorStop(1,pal[2]);
roundRect(g,b,b,W-b*2,H-b*2,r);g.fillStyle=grd;g.fill();g.restore();
if(tone!=="disabled")bevel(g,W,H,r,"rgba(255,255,255,0.95)","rgba(95,115,145,0.42)",b+1);return c;}

// ===== 生成清单 =====
const CELL=48, ICON=64, BTN=64, BAR_W=200, BAR_H=80, PANEL_W=600, PANEL_H=400, BG_W=250, BG_H=445;
const jobs = [
  ["cell_raised",      ()=>cellCanvas(CELL,"raised")],
  ["cell_sunken",      ()=>cellCanvas(CELL,"sunken")],
  ["icon_flag",        ()=>iconCanvas("flag",ICON)],
  ["icon_mine",        ()=>iconCanvas("mine",ICON)],
  ["icon_star",        ()=>iconCanvas("star",ICON)],
  ["bar",              ()=>barCanvas(BAR_W,BAR_H)],
  ["panel",            ()=>panelCanvas(PANEL_W,PANEL_H)],
  ["button_neutral",   ()=>buttonCanvas(BTN,BTN,"neutral")],
  ["button_primary",   ()=>buttonCanvas(BTN,BTN,"primary")],
  ["button_disabled",  ()=>buttonCanvas(BTN,BTN,"disabled")],
  ["background",       ()=>backgroundCanvas(BG_W,BG_H)],
];
const meta = {};
for (const [name, make] of jobs) {
  const c = make();
  meta[name] = { w: c.width, h: c.height, data: c.toDataURL("image/png") };
}
document.getElementById("out").textContent = JSON.stringify(meta);
</script></body></html>
